# Run the pre-built image from GitHub Container Registry.
#
# Usage:
#   docker compose up                       # uses :latest
#   IMAGE_TAG=0.1.0 docker compose up       # pin a specific release
#
# Requires a .env file — copy .env.example and fill in your OIDC provider
# details, SECRET_KEY, and SESSION_ENCRYPTION_PEPPER.

services:
  oidc-client:
    image: ghcr.io/tfindley/oidc-diagnositcs:${IMAGE_TAG:-latest}
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
