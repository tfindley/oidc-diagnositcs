name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub release
      packages: write       # push to GHCR
      attestations: write   # attest provenance
      id-token: write       # OIDC for attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OIDC Diagnostic Tool
            org.opencontainers.image.description=OIDC client for diagnosing SSO claims from Keycloak and other providers

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/${PACKAGE_NAME} \
            -f visibility=public || true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OIDC Diagnostic Tool v${{ steps.version.outputs.version }}"
          body: |
            ## OIDC Diagnostic Tool v${{ steps.version.outputs.version }}

            ### Docker image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ```

            Multi-arch: `linux/amd64` and `linux/arm64`.

            ### Quick start with Docker Compose

            ```yaml
            services:
              oidc-client:
                image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
                ports:
                  - "5000:5000"
                env_file:
                  - .env
                restart: unless-stopped
            ```

            Copy `.env.example` to `.env` and fill in your OIDC provider details, `SECRET_KEY`, and `SESSION_ENCRYPTION_PEPPER`.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup including multi-provider config and security hardening.
          generate_release_notes: true
